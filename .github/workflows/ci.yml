name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - run: npm ci
      - run: bash scripts/gerbang-ujian.sh

  # Sisir lints its own contract through its own Action, then checks that the workshop draft fails it.
  action:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          paths: contracts/src
      - id: draft
        uses: ./
        with:
          paths: fixtures/workshop
          upload-sarif: 'false'
          fail-on-error: 'false'
      - name: The workshop draft has error-level findings
        env:
          CODE: ${{ steps.draft.outputs.exit-code }}
        run: test "$CODE" = 1
