name: Bug report
description: The CLI, the playground or the contract does not work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [CLI, Playground, SisirLedger contract, Tests or CI, Documentation]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Output of `sisir --version`, the commit or the page URL
  - type: textarea
    id: logs
    attributes:
      label: Output or transaction hash (never paste a private key or seed phrase)
      render: text
