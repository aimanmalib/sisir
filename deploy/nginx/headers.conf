# Included in every location that sets its own Cache-Control: an add_header inside a location drops the
# ones inherited from the server block, so the shared headers live here and each location includes them.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
