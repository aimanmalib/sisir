# nginx for the Sisir playground (static files built by Vite). Runs as the unprivileged nginx user on a
# read-only file system: the pid file and every temp path sit under /tmp, which the container mounts as tmpfs.
worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 256; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  server_tokens off;
  sendfile on;
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # The reverse proxy also compresses; compressing here keeps the container correct on its own.
  gzip on;
  gzip_min_length 256;
  gzip_vary on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain;

  server {
    listen 8080;
    root /usr/share/nginx/html;

    location = /healthz {
      default_type text/plain;
      include /etc/nginx/headers.conf;
      add_header Cache-Control "no-store" always;
      return 200 "ok\n";
    }

    # Vite puts a content hash in every file name under /assets/, so these never change: cache for a year.
    # No `always`: a 404 for a missing asset must not be cached for a year.
    location /assets/ {
      include /etc/nginx/headers.conf;
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # HTML: revalidate every time so a deploy shows at once, and no-transform so the CDN in front leaves the
    # page untouched (no injected scripts). The proxy compresses it instead.
    location / {
      include /etc/nginx/headers.conf;
      add_header Cache-Control "no-cache, no-transform" always;
      try_files $uri $uri/ /index.html;
    }

    location = /favicon.svg {
      include /etc/nginx/headers.conf;
      add_header Cache-Control "public, max-age=86400" always;
    }
  }
}
